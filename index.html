<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persona Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=731bd54">
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="viewport">
    <div id="stage">
      <!-- 立ち絵: assets/character.webp を置くと表示されます -->
      <img id="character" src="assets/character.webp" alt="">

      <div id="menu-label">MENU <i>///</i></div>
      <div id="location"><svg viewBox="0 0 24 24" width="30" height="30"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg><span>Shujin<br>Academy</span></div>

      <div id="date"><div class="shape"></div><div class="d"><b>4</b> / <b>18</b><span class="wd">MON</span><span class="sun">☀</span></div><div class="t">放課後</div></div>

      <button class="item" data-id="persona" style="left:600px;top:150px;width:570px"><img src="assets/ui/persona.webp" alt="" draggable="false"></button>
      <button class="item" data-id="equip" style="left:595px;top:420px;width:320px"><img src="assets/ui/equip.webp" alt="" draggable="false"></button>
      <button class="item" data-id="skills" style="left:925px;top:345px;width:335px"><img src="assets/ui/skills.webp" alt="" draggable="false"></button>
      <button class="item" data-id="status" style="left:695px;top:500px;width:310px"><img src="assets/ui/status.webp" alt="" draggable="false"></button>
      <button class="item" data-id="party" style="left:905px;top:535px;width:335px"><img src="assets/ui/party.webp" alt="" draggable="false"></button>
      <button class="item" data-id="requests" style="left:445px;top:625px;width:335px"><img src="assets/ui/requests.webp" alt="" draggable="false"></button>
      <button class="item" data-id="calendar" style="left:785px;top:652px;width:345px"><img src="assets/ui/calendar.webp" alt="" draggable="false"></button>
      <button class="item" data-id="system" style="left:1065px;top:665px;width:365px"><img src="assets/ui/system.webp" alt="" draggable="false"></button>

      <div id="party-title">Party</div>
      <div id="party"></div>

      <div id="keys">
        <span><kbd>Z</kbd>決定</span><span><kbd>X</kbd>戻る</span><span><kbd>C</kbd>メニューガイド</span>
      </div>
      <div id="toast"></div>
    </div>
  </div>
  <script src="js/gpu.js?v=731bd54"></script>
  <script src="js/main.js?v=731bd54"></script>
</body>
</html>
