<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persona Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=feef3a6">
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="viewport">
    <div id="stage">
      <!-- 立ち絵: assets/character.png を置くと表示されます -->
      <img id="character" src="assets/character.png" alt="" onerror="this.remove()">

      <div id="menu-label">MENU <i>///</i></div>
      <div id="location"><svg viewBox="0 0 24 24" width="30" height="30"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg><span>Shujin<br>Academy</span></div>

      <div id="date"><div class="shape"></div><div class="d"><b>4</b> / <b>18</b><span class="wd">MON</span><span class="sun">☀</span></div><div class="t">放課後</div></div>

      <div id="persona-art"></div>
      <button class="item" data-id="persona" style="left:700px;top:245px;width:300px;height:140px"><span class="shape"></span><span class="lbl big"><small>ペルソナ</small><em>Persona</em></span></button>

      <button class="item dark" data-id="equip" style="left:610px;top:425px;width:290px;height:112px"><span class="shape"></span><span class="lbl"><svg viewBox="0 0 24 24"><path d="M4 20l9-9M13 11l6-7 1 1-7 6M3 21l2-2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><em>Equip</em><small>装備</small></span></button>
      <button class="item dark oval" data-id="skills" style="left:960px;top:395px;width:250px;height:112px"><span class="shape"></span><span class="lbl"><svg viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="currentColor"/></svg><em>Skills</em><small>スキル</small></span></button>
      <button class="item light" data-id="status" style="left:725px;top:552px;width:240px;height:105px"><span class="shape"></span><span class="lbl"><svg viewBox="0 0 24 24"><path d="M4 20V12h4v8zM10 20V6h4v14zM16 20V3h4v17z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><em>Status</em><small>ステータス</small></span></button>
      <button class="item dark" data-id="party" style="left:985px;top:560px;width:250px;height:100px"><span class="shape"></span><span class="lbl"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="currentColor"/><circle cx="5" cy="10" r="2.4" fill="currentColor"/><circle cx="19" cy="10" r="2.4" fill="currentColor"/><path d="M6 20c0-4 3-6 6-6s6 2 6 6z" fill="currentColor"/></svg><em>Party</em><small>パーティ</small></span></button>
      <button class="item dark paper" data-id="requests" style="left:460px;top:645px;width:310px;height:130px"><span class="shape"></span><span class="lbl"><em>Requests</em><small>依頼</small></span></button>
      <button class="item light" data-id="calendar" style="left:800px;top:665px;width:320px;height:105px"><span class="shape"></span><span class="lbl"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18M8 3v4M16 3v4M7 14h2m3 0h2m3 0h1M7 18h2m3 0h2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg><em>Calendar</em><small>カレンダー</small></span></button>
      <button class="item dark" data-id="system" style="left:1110px;top:705px;width:300px;height:125px"><span class="shape"></span><span class="lbl"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" stroke-width="1.8"/></svg><em>System</em><small>システム</small></span></button>

      <div id="party-title">Party</div>
      <div id="party"></div>

      <div id="keys">
        <span><kbd>Z</kbd>決定</span><span><kbd>X</kbd>戻る</span><span><kbd>C</kbd>メニューガイド</span>
      </div>
      <div id="toast"></div>
    </div>
  </div>
  <script src="js/gpu.js?v=feef3a6"></script>
  <script src="js/main.js?v=feef3a6"></script>
</body>
</html>
